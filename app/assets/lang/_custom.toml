# Custom Language File for Launcher Customizer

[ejs.app]
title = "Chillmon"

[ejs.landing]
mediaGitHubURL = "https://github.com/Nek0Paw/chillmon-launcher"
mediaXURL = "#"
mediaInstagramURL = "#"
mediaYouTubeURL = "#"
mediaDiscordURL = "https://discord.gg/zNWUXdt"

[ejs.settings]
sourceGithubLink = "https://github.com/Nek0Paw/chillmon-launcher"
